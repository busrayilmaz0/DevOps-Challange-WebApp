apiVersion: apps/v1
kind: Deployment
metadata:
  name: ziraat-webapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ziraat-webapp
  template:
    metadata:
      labels:
        app: ziraat-webapp
    spec:
      containers:
      - name: ziraat-webapp
        image: busra02/ziraat-webapp:latest
        ports:
        - containerPort: 52369
---
apiVersion: v1
kind: Service
metadata:
  name: ziraat-webapp-service
spec:
  type: LoadBalancer
  selector:
    app: ziraat-webapp
  ports:
  - protocol: TCP
    port: 52369
    targetPort: 52369